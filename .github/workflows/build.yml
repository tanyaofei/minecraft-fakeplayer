name: Build all versions

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nms:
    name: NMS ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - minecraft: "1.20.1"
            java: "17"
            remapped: true
          - minecraft: "1.20.2"
            java: "17"
            remapped: true
          - minecraft: "1.20.4"
            java: "17"
            remapped: true
          - minecraft: "1.20.6"
            java: "21"
            remapped: true
          - minecraft: "1.21"
            java: "21"
            remapped: true
          - minecraft: "1.21.1"
            java: "21"
            remapped: true
          - minecraft: "1.21.3"
            java: "21"
            remapped: true
          - minecraft: "1.21.4"
            java: "21"
            remapped: true
          - minecraft: "1.21.5"
            java: "21"
            remapped: true
          - minecraft: "1.21.6"
            java: "21"
            remapped: true
          - minecraft: "1.21.7"
            java: "21"
            remapped: true
          - minecraft: "1.21.8"
            java: "21"
            remapped: true
          - minecraft: "1.21.10"
            java: "21"
            remapped: true
          - minecraft: "26.1.2"
            java: "25"
            remapped: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Restore NMS cache
        id: nms-cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/spigotmc
          key: nms-${{ runner.os }}-${{ matrix.minecraft }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build NMS ${{ matrix.minecraft }}
        if: steps.nms-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/buildtools"
          cd "${RUNNER_TEMP}/buildtools"
          curl --fail --location --silent --show-error \
            --output BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          if [[ "${{ matrix.remapped }}" == "true" ]]; then
            java -jar BuildTools.jar --rev "${{ matrix.minecraft }}" --remapped
          else
            java -jar BuildTools.jar --rev "${{ matrix.minecraft }}"
          fi

      - name: Stage NMS repository
        shell: bash
        run: |
          mkdir -p nms-repository
          cp -R "${HOME}/.m2/repository/org/spigotmc/." nms-repository/

      - name: Upload NMS repository
        uses: actions/upload-artifact@v5
        with:
          name: nms-${{ matrix.minecraft }}
          path: nms-repository
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package universal plugin
    needs: nms
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Restore all NMS repositories
        uses: actions/download-artifact@v5
        with:
          pattern: nms-*
          path: nms-repository
          merge-multiple: true

      - name: Install NMS repositories
        shell: bash
        run: |
          mkdir -p "${HOME}/.m2/repository/org/spigotmc"
          cp -R nms-repository/. "${HOME}/.m2/repository/org/spigotmc/"

      - name: Build universal plugin
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Generate checksums
        shell: bash
        run: sha256sum target/fakeplayer-*.jar > target/SHA256SUMS

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: fakeplayer-${{ github.sha }}
          path: |
            target/fakeplayer-*.jar
            target/SHA256SUMS
          if-no-files-found: error
